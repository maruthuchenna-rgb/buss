<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>404 - Page Not Found | Stackly Corporate Business</title>
  <meta name="description" content="The page or corporate document you requested could not be found. Return to Stackly Home or previous page.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="asset/css/style.css">
  <link rel="stylesheet" href="asset/css/mobile-responsive.css">
</head>
<body class="page-404-body">
  <!-- Custom Cursor Elements -->
  <div id="cursorRing" aria-hidden="true"></div>
  <div id="cursorDot" aria-hidden="true"></div>

  <!-- Top Brand Navigation Header -->
  <header style="position: relative; z-index: 50; padding: 24px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(4, 8, 23, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);">
    <a href="index.html" class="brand-logo" aria-label="Stackly Home">
      <img src="asset/images/stackly_.webp" alt="Stackly" class="brand-logo-img" style="height: 38px;">
    </a>
    <a href="index.html" class="auth-back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Home</span>
    </a>
  </header>

  <!-- Background WebP Image (< 100KB) with Dark Gradient Overlay -->
  <div class="page-404-bg" aria-hidden="true"></div>

  <!-- Ambient Glowing Center Orb -->
  <div class="page-404-glow-orb page-404-glow-orb--center" aria-hidden="true"></div>

  
  

  <!-- 6 FLOATING PROJECT-RELATED ICONS -->
  <!-- 1. Strategy & Target -->
  <div class="floating-project-icon floating-icon--target" title="Corporate Strategy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <circle cx="12" cy="12" r="6"></circle>
      <circle cx="12" cy="12" r="2"></circle>
    </svg>
  </div>

  <!-- 2. Cloud Transformation -->
  <div class="floating-project-icon floating-icon--cloud" title="Enterprise Cloud">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
    </svg>
  </div>

  <!-- 3. Growth Analytics Chart -->
  <div class="floating-project-icon floating-icon--chart" title="Growth Analytics">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"></line>
      <line x1="12" y1="20" x2="12" y2="4"></line>
      <line x1="6" y1="20" x2="6" y2="14"></line>
    </svg>
  </div>

  <!-- 4. Security Shield -->
  <div class="floating-project-icon floating-icon--shield" title="Security &amp; Governance">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </svg>
  </div>

  <!-- 5. Global Network -->
  <div class="floating-project-icon floating-icon--globe" title="Global Logistics">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
  </div>

  <!-- 6. Executive Advisory Briefcase -->
  <div class="floating-project-icon floating-icon--briefcase" title="Executive Advisory">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
      <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
    </svg>
  </div>

  <!-- CENTER 404 CONTENT -->
  <main class="page-404-container">
    <div class="section-badge-pill section-badge-pill--light" style="margin-bottom: 12px;">
      <span class="pill-dot">•</span> 404 ERROR • RESOURCE NOT FOUND
    </div>

    <!-- Animated 404 Large Display -->
    <h1 class="error-code-404">404</h1>

    <h2 class="page-404-title">
      Oops! This Corporate Route Does Not Exist.
    </h2>

    <p class="page-404-desc">
      The page or enterprise document you requested might have been moved, renamed, or is temporarily unavailable in this advisory environment.
    </p>

    <!-- ONLY TWO BUTTONS AS REQUESTED -->
    <div class="page-404-actions">
      <!-- Button 1: Back to Home -->
      <a href="index.html" class="btn-404-home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Back to Home</span>
      </a>

      <!-- Button 2: Back to Page -->
      <button type="button" class="btn-404-back" onclick="window.history.back()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Page</span>
      </button>
    </div>
  </main>

  <!-- Footer copyright line -->
  <footer style="position: relative; z-index: 10; padding: 20px 40px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.06); font-size: 13px; color: rgba(255, 255, 255, 0.4);">
    © 2026 Stackly Corporate. All Rights Reserved.
  </footer>

  <!-- Core Theme Script -->
  <script src="asset/js/main.js"></script>
</body>
</html>
